[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "gtfs-diff-engine"
dynamic = ["version"]
description = "A diff engine for GTFS (General Transit Feed Specification) feeds"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "psutil>=5.9",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "datamodel-code-generator[ruff]>=0.59",
    "ruff>=0.11",
    "duckdb>=1.0",
]

[project.scripts]
gtfs-diff = "gtfs_diff.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/gtfs_diff/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gtfs_diff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]
exclude = ["src/gtfs_diff/models.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.format]
exclude = ["src/gtfs_diff/models.py"]
