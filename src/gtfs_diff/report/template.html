<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>GTFS diff</title>
<style>
:root {
  --bg: #ffffff; --ink: #15161a; --ink-2: #3c3f46; --muted: #6a6e77; --faint: #a2a6ad;
  --line: #ececea; --line-2: #dcdcd8; --hover: #f4f4f2; --raised: #ffffff;
  --accent: #2c55e8; --accent-soft: rgba(44, 85, 232, .09);
  --add: #12804a; --add-soft: rgba(18, 128, 74, .10);
  --del: #d2342e; --del-soft: rgba(210, 52, 46, .09);
  --mod: #b36a00; --mod-soft: rgba(179, 106, 0, .11);
  --hl: #c3560b; --hl-soft: rgba(195, 86, 11, .08);
  --same: #5b5e66; --casing: #ffffff; --map-bg: #f3f3f1; --grid: rgba(20, 20, 30, .07);
  --shadow: 0 1px 2px rgba(15, 16, 20, .06), 0 12px 32px rgba(15, 16, 20, .10);
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13.5px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 40px; }
.mono { font-family: var(--mono); font-size: .9em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.t-add { color: var(--add); } .t-del { color: var(--del); } .t-mod { color: var(--mod); } .t-hl { color: var(--hl); }
.ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round; }
.link { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-weight: 550;
  display: inline-flex; align-items: center; gap: 6px; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.link .ico { width: 14px; height: 14px; transition: transform .15s; }
.link:hover .ico { transform: translateX(2px); }

/* Top bar and hero */
.topbar { display: flex; align-items: center; justify-content: space-between; height: 52px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -.01em; font-size: 13.5px; }
.brand svg { width: 20px; height: 20px; }
.actions { display: flex; align-items: center; gap: 4px; }
.ghost { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 5px 9px; border-radius: 8px;
  display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; }
.ghost:hover { background: var(--hover); color: var(--ink); }
.hero { padding-top: 22px; padding-bottom: 30px; }
.releases { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 20px; margin-bottom: 18px; }
.rel-k { display: block; font-size: 11px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); }
.rel-d { display: block; font-size: 14px; font-weight: 600; }
.rel-n { display: block; font-family: var(--mono); font-size: 11.5px; color: var(--muted); max-width: 46ch;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rel-arrow { color: var(--faint); padding-bottom: 16px; }
.rel-arrow .ico { width: 18px; height: 18px; stroke-width: 1.5; }
h1 { font-size: clamp(28px, 2.9vw, 38px); line-height: 1.08; font-weight: 700; letter-spacing: -.035em; margin: 0; }
h1 .of { color: var(--faint); font-weight: 600; }
.lede { font-size: 15px; line-height: 1.6; color: var(--ink-2); max-width: 72ch; margin: 10px 0 0; }
.lede b { font-weight: 650; font-variant-numeric: tabular-nums; }
.lede .link { font-size: inherit; }
.meta { margin-top: 8px; font-size: 12.5px; color: var(--faint); }

/* Tabs */
.tabs { position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 86%, transparent); -webkit-backdrop-filter: saturate(1.6) blur(14px); backdrop-filter: saturate(1.6) blur(14px); }
.tabs .wrap { display: flex; gap: 6px; }
.tab { flex: 0 1 300px; min-width: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 11px; align-items: center;
  padding: 11px 16px 10px 14px; margin-bottom: -1px; border: 0; border-bottom: 3px solid transparent; border-radius: 10px 10px 0 0;
  background: none; cursor: pointer; text-align: left; transition: background .15s, border-color .15s; }
.tab:hover { background: var(--hover); }
.tab > .ico { grid-row: span 2; width: 20px; height: 20px; color: var(--faint); transition: color .15s; }
.tab .lb { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 650; letter-spacing: -.01em; color: var(--ink); }
.tab .c { font-size: 11.5px; font-weight: 650; padding: 1px 8px; border-radius: 999px; background: var(--line); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tab .ds { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab:hover > .ico { color: var(--ink-2); }
.tab.on { border-bottom-color: var(--accent); }
.tab.on > .ico { color: var(--accent); }
.tab.on .c { background: var(--accent); color: #fff; }
.tabs.stuck .ds { display: none; }
.tabs.stuck .tab { padding-top: 9px; padding-bottom: 8px; }
.tabs.stuck .tab > .ico { grid-row: auto; width: 18px; height: 18px; }

/* Keep exploring */
.next { margin-top: 64px; padding-top: 22px; border-top: 1px solid var(--line); }
.next h3 { margin-top: 0; }
.next-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 4px 32px; }
.next-btn { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 14px; align-items: center; width: calc(100% + 24px);
  margin: 0 -12px; padding: 12px; border: 0; border-radius: 10px; background: none; cursor: pointer; text-align: left; }
.next-btn:hover { background: var(--hover); }
.next-btn > .ico { grid-row: span 2; width: 22px; height: 22px; color: var(--accent); }
.next-btn .lb { font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
.next-btn .ds { color: var(--muted); font-size: 13px; }
.next-btn .go { grid-row: 1 / span 2; grid-column: 3; color: var(--faint); transition: transform .15s, color .15s; }
.next-btn:hover .go { color: var(--accent); transform: translateX(3px); }
main { padding: 30px 0 72px; min-height: 60vh; }
main.enter { animation: enter .22s ease-out; }
@keyframes enter { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* Sections */
.sec + .sec { margin-top: 52px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px; margin-bottom: 12px; }
h2 { font-size: 18px; line-height: 1.25; font-weight: 680; letter-spacing: -.02em; margin: 0; }
.sec-sub { color: var(--muted); margin: 2px 0 0; max-width: 70ch; }
h3 { font-size: 11.5px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 28px 0 10px; }

/* Highlights */
.hk { display: grid; grid-template-columns: minmax(200px, 300px) minmax(0, 1fr); gap: 8px 48px; padding: 16px 0; border-top: 1px solid var(--line); }
.hk:first-child { border-top: 0; padding-top: 4px; }
.hk-title { display: flex; align-items: center; gap: 9px; font-size: 14.5px; font-weight: 640; letter-spacing: -.01em; }
.hk-title .ico { color: var(--hl); width: 16px; height: 16px; }
.hk-count { color: var(--hl); font-variant-numeric: tabular-nums; }
.hk-note { color: var(--muted); font-size: 13px; margin: 2px 0 0 25px; }
.hk-items { min-width: 0; }
.row-btn { display: grid; grid-template-columns: minmax(0, max-content) minmax(0, 1fr) auto 14px; gap: 18px; align-items: baseline;
  width: calc(100% + 24px); margin: 0 -12px; padding: 6px 12px; border: 0; border-radius: 7px; background: none;
  text-align: left; cursor: pointer; }
.row-btn:hover { background: var(--hover); }
.row-btn .id { font-family: var(--mono); font-size: 12.5px; font-weight: 560; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-btn .nm { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-btn .fig { font-variant-numeric: tabular-nums; font-weight: 620; white-space: nowrap; }
.row-btn .go { color: var(--faint); opacity: 0; transform: translateX(-4px); transition: opacity .15s, transform .15s; align-self: center; }
.row-btn:hover .go, .row-btn:focus-visible .go { opacity: 1; transform: none; color: var(--ink); }
.row-btn .go .ico { width: 14px; height: 14px; }
.row-btn.plain .id { font-family: var(--sans); font-size: 13.5px; }
.more { color: var(--muted); font-size: 13px; padding: 6px 0 0; }
.clear { display: flex; align-items: center; gap: 10px; font-size: 14.5px; color: var(--ink-2); }
.clear .ico { color: var(--add); width: 22px; height: 22px; stroke-width: 2.2; }
.inline-hl { margin: 28px 0 0; padding-left: 18px; border-left: 2px solid var(--hl); }
.inline-hl .hk { grid-template-columns: 1fr; gap: 6px; padding: 0; border: 0; }
.inline-hl .hk + .hk { margin-top: 18px; }

/* Change overview */
.legend-inline { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 13px; color: var(--muted); }
.legend-inline span { display: inline-flex; align-items: center; gap: 7px; }
.legend-inline i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.cf { display: grid; grid-template-columns: minmax(150px, 230px) minmax(80px, 1fr) 76px 76px 76px 14px; gap: 22px; align-items: center;
  width: calc(100% + 24px); margin: 0 -12px; padding: 7px 12px; border: 0; border-radius: 7px; background: none; text-align: left; cursor: pointer; }
.cf:hover { background: var(--hover); }
.cf:hover .go { opacity: 1; transform: none; color: var(--ink); }
.cf .go { color: var(--faint); opacity: 0; transform: translateX(-4px); transition: opacity .15s, transform .15s; }
.cf .go .ico { width: 14px; height: 14px; }
.cf .nm { font-family: var(--mono); font-size: 12.5px; font-weight: 560; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cf .nm small { font-family: var(--sans); font-weight: 500; font-size: 12px; margin-left: 8px; }
.cf .n { text-align: right; font-variant-numeric: tabular-nums; font-size: 12.5px; }
.cf .n.z { color: var(--faint); }
.bar { display: flex; gap: 2px; height: 7px; min-width: 0; }
.bar i { display: block; height: 100%; border-radius: 2px; min-width: 3px; }
.bar .a { background: var(--add); } .bar .d { background: var(--del); } .bar .m { background: var(--mod); }
.bar .x { background: var(--line-2); }
.cf-head { font-size: 11.5px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); cursor: default; padding-bottom: 6px; }
.cf-head:hover { background: none; }
.quiet { color: var(--muted); font-size: 13.5px; margin: 18px 0 0; max-width: 90ch; }
.flink { border: 0; background: none; padding: 0; font: inherit; font-family: var(--mono); font-size: .92em; color: var(--ink-2); cursor: pointer; }
.flink:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }

/* Files */
.files { display: grid; grid-template-columns: 264px minmax(0, 1fr); gap: 40px; align-items: start; }
.fnav { position: sticky; top: 60px; max-height: calc(100vh - 90px); overflow-y: auto; margin: -4px -8px 0; padding: 4px 8px 24px; }
.fnav-h { font-size: 11px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); margin: 22px 4px 6px; }
.fnav-h:first-of-type { margin-top: 14px; }
.fn { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px; width: 100%; padding: 5px 10px;
  border: 0; border-radius: 7px; background: none; text-align: left; cursor: pointer; color: var(--ink-2); }
.fn:hover { background: var(--hover); color: var(--ink); }
.fn.on { background: var(--accent-soft); color: var(--ink); }
.fn .nm { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.fn.on .nm { font-weight: 650; }
.fn .ct { margin-left: auto; font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums; display: flex; gap: 6px; }
.fn.q { color: var(--muted); padding-top: 4px; padding-bottom: 4px; }
.fd { min-width: 0; }
.fd-title { font: 650 20px/1.25 var(--mono); letter-spacing: -.02em; margin: 0; overflow-wrap: anywhere; }
.fd-meta { color: var(--muted); margin: 4px 0 0; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.fd-meta .tag { font-weight: 650; }
.kinds { display: flex; flex-wrap: wrap; gap: 8px 32px; margin: 22px 0 0; border-bottom: 1px solid var(--line); }
.kind { position: relative; border: 0; background: none; cursor: pointer; padding: 0 0 9px; text-align: left; color: var(--muted); font-size: 12.5px; }
.kind b { display: block; font-size: 21px; line-height: 1.15; font-weight: 680; letter-spacing: -.025em; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.kind:hover b { color: var(--ink); }
.kind.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: currentColor; }
.kind.on.k-added, .kind.on.k-added b { color: var(--add); }
.kind.on.k-deleted, .kind.on.k-deleted b { color: var(--del); }
.kind.on.k-modified, .kind.on.k-modified b { color: var(--mod); }
.cols { display: grid; grid-template-columns: max-content minmax(60px, 260px) max-content max-content; gap: 0 18px; align-items: center; }
.col { display: contents; cursor: pointer; }
.col > * { padding: 4px 0; }
.col .nm { font-family: var(--mono); font-size: 12px; padding-left: 10px; border-radius: 7px 0 0 7px; }
.col .pct { padding-right: 10px; border-radius: 0 7px 7px 0; color: var(--muted); }
.col:hover > * { background: var(--hover); }
.col .bar { height: 100%; align-items: center; }
.col .bar i { height: 6px; background: var(--mod); opacity: .7; }
.col.on .nm { color: var(--accent); font-weight: 650; }
.col.on .bar i { background: var(--accent); opacity: 1; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; margin: 18px 0 8px; }
.count { color: var(--muted); font-size: 13px; }
.count b { color: var(--ink); font-weight: 620; }
.search { display: flex; align-items: center; gap: 8px; padding: 6px 13px; border-radius: 999px; background: var(--hover);
  color: var(--faint); width: min(300px, 100%); transition: box-shadow .15s, background .15s; }
.search:focus-within { background: var(--bg); box-shadow: 0 0 0 1.5px var(--accent), 0 0 0 5px var(--accent-soft); color: var(--accent); }
.search input { border: 0; background: none; outline: none; font: inherit; font-size: 13px; color: var(--ink); width: 100%; min-width: 0; }
.search input::placeholder { color: var(--faint); }
.search kbd { font: 11px var(--mono); color: var(--faint); border: 1px solid var(--line-2); border-radius: 4px; padding: 0 5px; }
.tablewrap { overflow-x: auto; margin: 0 -2px; padding: 0 2px; }
table { border-collapse: collapse; width: 100%; font-size: 12px; }
th { font: 650 10.5px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); text-align: left;
  padding: 8px 20px 8px 0; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
td { font-family: var(--mono); padding: 7px 20px 7px 0; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: top; }
td.same { color: var(--faint); }
td.ln { color: var(--faint); font-size: 11.5px; }
td.ln.a { color: var(--add); } td.ln.d { color: var(--del); }
tbody tr:hover td { background: var(--hover); }
tbody tr:hover td:first-child { box-shadow: -8px 0 0 var(--hover); }
tr.focus td { background: var(--hl-soft); }
tr.focus td:first-child { box-shadow: -8px 0 0 var(--hl-soft), inset 2px 0 0 var(--hl); padding-left: 8px; }
del { background: var(--del-soft); color: var(--del); text-decoration: line-through; text-decoration-thickness: 1px; padding: 1px 5px; border-radius: 4px; }
ins { background: var(--add-soft); color: var(--add); text-decoration: none; padding: 1px 5px; border-radius: 4px; }
.arrow { color: var(--faint); padding: 0 5px; }
.pager { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 16px 0 0; color: var(--muted); font-size: 13px; }
.pg { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 0; border-radius: 8px; background: none; cursor: pointer; color: var(--ink-2); }
.pg:hover:not(:disabled) { background: var(--hover); }
.pg:disabled { color: var(--faint); cursor: default; }
.note { color: var(--ink-2); font-size: 13.5px; margin: 16px 0; padding-left: 14px; border-left: 2px solid var(--line-2); max-width: 80ch; }
.fine { margin-top: 28px; font-size: 12.5px; color: var(--faint); max-width: 80ch; }
.fine > div + div { margin-top: 4px; }
.empty { color: var(--muted); padding: 32px 0; }

/* Shapes */
.legend { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 12.5px; color: var(--ink-2); }
.legend > span { display: inline-flex; align-items: center; gap: 9px; }
.sw { width: 26px; height: 10px; flex: none; overflow: visible; }
.filters { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; margin: 18px 0 22px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chipbtn { border: 0; background: none; cursor: pointer; padding: 5px 11px; border-radius: 999px; color: var(--muted); font-size: 13px; font-weight: 520; }
.chipbtn:hover { color: var(--ink); background: var(--hover); }
.chipbtn.on { background: var(--ink); color: var(--bg); }
.chipbtn .c { margin-left: 6px; opacity: .6; font-variant-numeric: tabular-nums; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 30px 26px; }
.thumb { border: 0; background: none; padding: 0; text-align: left; cursor: pointer; min-width: 0; }
.thumb svg { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; border-radius: 12px; transition: background .18s; }
.thumb:hover svg { background: var(--hover); }
.thumb .tt { margin-top: 8px; font: 620 12px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thumb .tm { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thumb .tm b { font-weight: 620; }
.tag-changed { color: var(--mod); } .tag-added { color: var(--add); } .tag-deleted { color: var(--del); } .tag-redrawn, .tag-renamed { color: var(--ink-2); }
.ln { fill: none; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.ln.case { stroke: var(--casing); }
.ln.same { stroke: var(--same); }
.ln.old { stroke: var(--del); }
.ln.new { stroke: var(--add); }
.ln.link { stroke: var(--ink-2); }
.dot { vector-effect: non-scaling-stroke; stroke: var(--casing); stroke-width: 1.5; }
.dot.old { fill: var(--del); } .dot.new { fill: var(--add); } .dot.hollow { fill: var(--casing); stroke: var(--del); stroke-width: 2.5; }
.halo { fill: var(--hl); fill-opacity: .13; stroke: var(--hl); stroke-opacity: .75; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.hit { fill: none; stroke: transparent; stroke-width: 16; vector-effect: non-scaling-stroke; cursor: pointer; }
svg.hide-old .L-old, svg.hide-new .L-new, svg.hide-same .L-same { display: none; }

/* Dialogs */
dialog { border: 0; padding: 0; color: var(--ink); background: var(--bg); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(10, 11, 14, .5); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
dialog[open] { animation: pop .18s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.99); } to { opacity: 1; transform: none; } }
.sheet { width: min(1480px, calc(100vw - 32px)); height: calc(100vh - 32px); max-width: none; max-height: none; border-radius: 16px; overflow: hidden; }
.sheet[open] { display: flex; flex-direction: column; }
.dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 12px 8px 20px; border-bottom: 1px solid var(--line); flex: none; }
.dlg-title { min-width: 0; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.dlg-title .k { font-size: 11.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
.dlg-title .t { font: 650 14.5px var(--mono); overflow-wrap: anywhere; }
.dlg-title .s { color: var(--muted); }
.dlg-nav { display: flex; align-items: center; gap: 2px; flex: none; color: var(--muted); font-size: 13px; }
.dlg-nav .pos { padding: 0 8px; font-variant-numeric: tabular-nums; }
.iconbtn { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border: 0; border-radius: 9px;
  background: none; cursor: pointer; color: var(--ink-2); }
.iconbtn:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
.iconbtn:disabled { color: var(--faint); cursor: default; }
.iconbtn .ico { width: 18px; height: 18px; }
.zoomwrap { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 330px; }

<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);

// Packed by shape_points.pack; older reports hold plain lists.
function unpack(a) {
  if (!Array.isArray(a) || !a.length || Array.isArray(a[0])) return a || [];
  const out = [];
  let x = 0, y = 0, s = 0;
  for (let i = 0; i < a.length; i += 5) {
    x += a[i]; y += a[i + 1]; s += a[i + 2];
    const f = a[i + 3], g = a[i + 4];
    out.push([x / 1e6, y / 1e6, Math.round(s * 1e6) / 1e6, f & 1, g < 0 ? null : g / 10, (f >> 1) & 1]);
  }
  return out;
}
if (D.shapes) for (const i of D.shapes.items) { i.base_coords = unpack(i.base_coords); i.new_coords = unpack(i.new_coords); }

const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, ...kids) => {
  const n = document.createElement(tag);

  return n;
};
const ICONS = {
  arrow: "M5 12h14M13 6l6 6-6 6",
  left: "M15 6l-6 6 6 6", right: "M9 6l6 6-6 6", close: "M6 6l12 12M18 6L6 18",
  plus: "M12 5v14M5 12h14", minus: "M5 12h14",
  fit: "M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5",
  map: "M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14",
  search: "M10.5 17a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13zM20 20l-4.8-4.8",
  check: "M4.5 12.5l5 5L19.5 7",
  calendarX: "M4 6.5h16V20H4zM4 10.5h16M8.5 3.5v4M15.5 3.5v4M10 13.5l4 4M14 13.5l-4 4",
  calendarOff: "M4 6.5h16V20H4zM4 10.5h16M8.5 3.5v4M15.5 3.5v4M9 15.5h6",
  pinX: "M12 21s-6.5-5.6-6.5-11.2a6.5 6.5 0 0 1 13 0C18.5 15.4 12 21 12 21zM10 7.8l4 4M14 7.8l-4 4",
  pinMove: "M9 21s-5.5-4.8-5.5-9.5a5.5 5.5 0 0 1 11 0C14.5 16.2 9 21 9 21zM9 11.5h.01M15.5 5.5h5M18.5 3l2.5 2.5-2.5 2.5",
  grid: "M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z",
  file: "M14 3H6v18h12V7zM14 3v4h4M9 12.5h6M9 16.5h6",
  route: "M6 19.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM18 9.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM8.2 15.6C12 13 9 9.6 15.6 8.2",
  sliders: "M4 7h10M18 7h2M4 17h4M12 17h8M16 4.5v5M10 14.5v5",
  eye: "M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12zM12 14.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z",
  eyeOff: "M3 3l18 18M10.6 5.6A9.6 9.6 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a16 16 0 0 1-2.7 3.4M6.6 6.6C3.9 8.3 2.5 12 2.5 12s3.5 6.5 9.5 6.5a9 9 0 0 0 4.4-1.1",
};
const icon = name => { const s = sv("svg", { viewBox: "0 0 24 24", class: "ico", "aria-hidden": "true" }); s.append(sv("path", { d: ICONS[name] })); return s; };
const fmt = n => n == null ? "–" : Number(n).toLocaleString("en-US");
const plural = (n, w, ws) => `${fmt(n)} ${n === 1 ? w : ws || w + "s"}`;
const metres = m => m == null ? "–" : m >= 1000 ? `${(m / 1000).toLocaleString("en-US", { maximumFractionDigits: 2 })} km`

const dateFmt = (d, opts) => d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", ...opts });
const sum = a => a.reduce((x, y) => x + (y || 0), 0);
const go = () => el("span", { class: "go" }, icon("arrow"));

const state = { tab: "overview", file: null, part: null, col: null, shape: "all", page: 0, view: null, all: false,
  q: "", shapeQ: "", fileQ: "", focus: null, map: null, whole: false, tiles: true, hidden: {} };
const PAGE_SIZE = 10;
try { state.tiles = localStorage.getItem("gtfs-diff-tiles") !== "off"; } catch (e) { /* storage blocked */ }

const UNSUPPORTED = (D.metadata.unsupported_files || []).map(f => ({ name: f.file_name, action: "unsupported",
  present_in: f.present_in, stats: {}, columns_added: [], columns_deleted: [], ignored: [] }));

const changedFiles = D.files.filter(f => f.action !== "unchanged" && f.action !== "not_compared");

  modified: sum(D.files.map(f => (f.stats || {}).rows_modified_count)),

// Mobility Database names (mdb-ID-YYYYMMDDHHMM) carry the release date.
function release(src) {
  const parts = String(src || "").replace(/\/+$/, "").split("/");
  let name = parts[parts.length - 1];
  if (name === "extracted" && parts.length > 1) name = parts[parts.length - 2];
  const m = name.match(/^mdb-(\d+)-(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})/);

/* ---------- Header ---------- */
function header() {

  if (parts.length) {

    });

  }
  const fileParts = [[changedFiles.length, "changed"], [quietFiles.length, "with no changes"], [skippedFiles.length, "not compared"]].filter(([n]) => n);
  if (fileParts.length) {
    lede.push(fileParts.map(([n, w], i) => `${i ? fmt(n) : plural(n, "file")} ${w}`).join(", ").replace(/, ([^,]*)$/, " and $1") + ". ");

// Rows from report/html.py settings_rows.
function settings() {
  const btn = document.getElementById("btn-settings");
  if (!D.settings) { btn.remove(); return; }

/* ---------- Notable highlights ---------- */

function refId(h, file, feed) {

// Base and new references: modified; base only: deleted; new only: added.

  const row = highlightRow(h);
  const present = n => D.files.find(f => f.name === n);

function highlightRowText(h) {

function shapeEdits(i) {

      for (const p of pts) {

      el("p", { class: "sec-sub" }, "Every changed shape, old line against new, largest change first. Open one to explore it on a street map."))),
    shapeLegend());
  const kinds = ["all", ...SHAPE_ORDER.filter(k => S.counts[k])];
  const search = el("label", { class: "search" }, icon("search"),
    el("input", { id: "shapeq", type: "search", placeholder: "Find a shape or route", value: state.shapeQ, "aria-label": "Find a shape or route",
      oninput: e => { state.shapeQ = e.target.value; render(); } }), state.shapeQ ? null : el("kbd", {}, "/"));
  p.append(el("div", { class: "filters" }, el("div", { class: "chips", role: "tablist" }, kinds.map(k =>
    el("button", { class: "chipbtn" + (k === state.shape ? " on" : ""), role: "tab", "aria-selected": String(k === state.shape), onclick: () => { state.shape = k; render(); } },
      k === "all" ? "All" : SHAPE_FILTER[k], el("span", { class: "c" }, fmt(k === "all" ? total : S.counts[k]))))), state.shape === "renamed" ? null : search));
  if (state.shape === "renamed") {
    const rows = S.renamed.map(([b, n, r]) => el("tr", {}, el("td", {}, b), el("td", {}, n), el("td", {}, r ?? "")));
    p.append(el("p", { class: "sec-sub", style: "margin:-10px 0 14px" }, "New IDs for the very same lines."),
      el("div", { class: "tablewrap" }, el("table", {}, el("thead", {}, el("tr", {}, el("th", {}, "Old shape_id"), el("th", {}, "New shape_id"), el("th", {}, "Route"))), el("tbody", {}, rows))));
    return p;
  }

  const inGroup = state.shape === "all" ? total : S.counts[state.shape];

  p.append(el("div", { class: "gallery" }, items.map(i => thumb(i, items))));
  if (drawnInGroup < inGroup) p.append(el("div", { class: "fine" },
    `Drawn here: ${fmt(drawnInGroup)} of ${fmt(inGroup)}, the largest changes first. The page draws up to ${fmt(D.caps.shapes)} shapes with ${fmt(D.caps.points)} points each; the JSON report lists them all.`));
  return p;
}

/* ---------- Map dialog ---------- */
const zoomDlg = document.getElementById("zoom");
let mapList = [], mapIndex = 0;

function openMap(list, index) {
  if (!list.length || index < 0) return;
  mapList = list; mapIndex = index;
  state.whole = false;
  showMap();
  if (!zoomDlg.open) zoomDlg.showModal();
}

function mapBox() {
  const narrow = innerWidth <= 900;
  const dlgW = narrow ? innerWidth : Math.min(1480, innerWidth - 32);
  const dlgH = narrow ? innerHeight : innerHeight - 32;
  return narrow ? { pw: dlgW, ph: innerHeight * 0.58 } : { pw: dlgW - 330, ph: dlgH - 51 };
}

function showMap() {
  const entry = mapList[mapIndex];
  const nav = document.getElementById("zoom-nav");
  const step = d => () => { if (mapList[mapIndex + d]) { mapIndex += d; state.whole = false; showMap(); } };
  swap(nav,
    mapList.length > 1 ? [el("button", { class: "iconbtn", "aria-label": "Previous", title: "Previous (←)", disabled: mapIndex === 0 ? "" : null, onclick: step(-1) }, icon("left")),
      el("span", { class: "pos" }, `${mapIndex + 1} of ${mapList.length}`),
      el("button", { class: "iconbtn", "aria-label": "Next", title: "Next (→)", disabled: mapIndex >= mapList.length - 1 ? "" : null, onclick: step(1) }, icon("right"))] : null,
    el("button", { class: "iconbtn", "aria-label": "Close", title: "Close (Esc)", onclick: () => zoomDlg.close() }, icon("close")));
  if (entry.item) shapeMap(entry.item); else stopMap(entry.stop);
  state.map = entry.item ? `${entry.item.base || ""}|${entry.item.new || ""}` : null;
  writeHash();
}

function mapFrame(svg, extra) {
  const box = mapBox();
  const view = el("div", { class: "mapview" + (state.tiles ? "" : " notiles") });
  const zoomer = makeZoomable(svg, view, box.pw);
  const tilesBtn = el("button", { class: "mbtn" + (state.tiles ? "" : " off"), title: "Show or hide the street map", "aria-pressed": String(state.tiles),
    onclick: () => {
      state.tiles = !state.tiles;
      try { localStorage.setItem("gtfs-diff-tiles", state.tiles ? "on" : "off"); } catch (e) { /* storage blocked */ }
      view.classList.toggle("notiles", !state.tiles); tilesBtn.classList.toggle("off", !state.tiles); tilesBtn.setAttribute("aria-pressed", String(state.tiles));
      if (state.tiles) view.refreshTiles();
    } }, icon("map"), "Street map");
  put(view, svg, zoomer.bar, extra,
    el("div", { class: "mapctl tr" }, el("span", { class: "offline", title: "The street map needs an internet connection. The lines are exact without it." }, "Offline: lines only"), tilesBtn),
    zoomer.scale, el("div", { class: "credit" }, MAP_CREDIT), el("div", { class: "mapinfo", id: "zoom-info" }));
  requestAnimationFrame(zoomer.updateScale);
  return { view, zoomer };
}

function shapeMap(i) {
  swap(document.getElementById("zoom-title"),
    el("span", { class: "k tag-" + i.change }, SHAPE_LABEL[i.change]), el("span", { class: "t" }, shapeTitle(i)),
    i.route ? el("span", { class: "s" }, `route ${i.route}`) : null);
  const paired = i.base_coords.length > 1 && i.new_coords.length > 1;
  const items = paired ? shapeEdits(i) : [];
  const svg = shapeSvg(i, true, paired && !state.whole, mapBox());
  for (const k of Object.keys(state.hidden)) if (state.hidden[k]) svg.classList.add("hide-" + k);
  const seg = paired ? el("div", { class: "mapctl tc" }, el("div", { class: "seg" },
    el("button", { class: state.whole ? "" : "on", onclick: () => { state.whole = false; showMap(); } }, "Where it moved"),
    el("button", { class: state.whole ? "on" : "", onclick: () => { state.whole = true; showMap(); } }, "Whole shape"))) : null;
  const { view, zoomer } = mapFrame(svg, seg);
  const gap = shapeGap(i);
  const facts = [];
  if (i.route) facts.push(["Route", i.route]);
  if (i.base_points != null || i.new_points != null) facts.push(["Points", i.base_points != null && i.new_points != null && i.base_points !== i.new_points ? `${fmt(i.base_points)} → ${fmt(i.new_points)}` : fmt(i.new_points ?? i.base_points)]);
  if (i.base_len != null || i.new_len != null) facts.push(["Length", i.base_len != null && i.new_len != null ? `${metres(i.base_len)} → ${metres(i.new_len)}` : metres(i.base_len ?? i.new_len)]);
  if (i.base && i.new && i.base !== i.new) facts.push(["shape_id", `${i.base} → ${i.new}`]);
  const toggle = (k, sw, label) => {
    const b = el("button", { class: "toggle" + (state.hidden[k] ? " off" : ""), "aria-pressed": String(!state.hidden[k]), title: "Show or hide on the map",
      onclick: () => { state.hidden[k] = !state.hidden[k]; svg.classList.toggle("hide-" + k, state.hidden[k]); b.classList.toggle("off", state.hidden[k]);
        b.setAttribute("aria-pressed", String(!state.hidden[k])); b.querySelector(".eye").replaceChildren(icon(state.hidden[k] ? "eyeOff" : "eye")); } },
      sw, label, el("span", { class: "eye" }, icon(state.hidden[k] ? "eyeOff" : "eye")));
    return b;
  };
  const e = pointEdits(i);
  const keys = paired ? [toggle("same", lineSwatch("same"), "Same in both shapes"), toggle("old", lineSwatch("old"), "Old shape only"), toggle("new", lineSwatch("new", true), "New shape only")]
    : [el("div", { class: "toggle static" }, i.base_coords.length ? lineSwatch("old") : lineSwatch("new"), i.base_coords.length ? "The deleted shape" : "The added shape")];
  const notes = [];
  if (items.some(x => x.at.length > 1)) notes.push(el("div", { class: "toggle static" }, el("span", { style: "display:inline-flex" }, lineSwatch("old", false, true)), `Thick: more than ${FAR_M} m apart`));
  if (paired && e.onlyBase.length + e.onlyNew.length <= MAX_DOTS && e.onlyBase.length + e.onlyNew.length) notes.push(el("div", { class: "toggle static" }, dotSwatch("old"), "A point in one shape only"));
  let list = null;
  const maxGap = Math.max(1, ...items.map(x => x.gap));
  if (items.length) {
    list = el("div", {}, items.map(it => el("button", { class: "chg", onclick: ev => {
      for (const b of list.querySelectorAll(".chg.on")) b.classList.remove("on");
      ev.currentTarget.classList.add("on");
      const pts = it.at.map(svg.toView), xs = pts.map(q => q[0]), ys = pts.map(q => q[1]);
      const extent = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys));
      zoomer.focusOn((Math.min(...xs) + Math.max(...xs)) / 2, (Math.min(...ys) + Math.max(...ys)) / 2, Math.max(extent * 1.6, 120));
      document.getElementById("zoom-info").textContent = `${it.label} · ${metres(it.gap)} ${it.detail}`;
    } }, el("span", { class: "l " + it.cls }, it.label), el("span", { class: "g" }, metres(it.gap)), el("span", { class: "d" }, it.detail),
      el("span", { class: "bar" }, el("i", { class: it.side === "old" ? "d" : "a", style: `width:${Math.max(2, it.gap / maxGap * 100)}%` })))));
  }
  const side = el("aside", { class: "side" },
    gap != null && i.change !== "renamed" ? [el("div", { class: "big" }, gap < 0.05 ? "0 m" : metres(gap)), el("div", { class: "big-sub" }, gap < 0.05 ? "The line did not move." : "Largest distance between the old and new line.")]
      : [el("div", { class: "big tag-" + i.change }, SHAPE_LABEL[i.change]), el("div", { class: "big-sub" }, i.change === "added" ? "Only in the new release." : "Only in the old release.")],
    el("dl", { class: "facts" }, facts.map(([k, v]) => [el("dt", {}, k), el("dd", {}, v)])),
    el("h3", {}, "On the map"), el("div", { class: "toggles" }, keys, notes),
    list ? [el("h3", {}, `${plural(items.length, "change")}, largest first`), list] : null);
  document.getElementById("zoom-body").replaceChildren(view, side);
}

function stopMap(h) {
  const d = h.details || {}, place = stopPlace(h);
  const id = refId(h, "stops.txt", "base") ?? refId(h, "stops.txt", "new");
  swap(document.getElementById("zoom-title"),
    el("span", { class: "k t-mod" }, "Stop moved"),
    el("span", { class: "t" }, id), d.stop_name ? el("span", { class: "s" }, d.stop_name) : null);
  const svg = stopSvg(h, mapBox());
  const { view } = mapFrame(svg);
  const facts = [["Stop", d.stop_name || id], ["stop_id", id],
    ["Old place", place.base.map(v => v.toFixed(6)).join(", ")], ["New place", place.new.map(v => v.toFixed(6)).join(", ")]];
  const side = el("aside", { class: "side" },
    el("div", { class: "big" }, metres(d.distance_m)),
    el("div", { class: "big-sub" }, "Between the old and the new place."),
    el("dl", { class: "facts" }, facts.map(([k, v]) => [el("dt", {}, k), el("dd", {}, v)])),
    el("h3", {}, "On the map"),
    el("div", { class: "toggles" }, el("div", { class: "toggle static" }, dotSwatch("hollow"), "Old place"),
      el("div", { class: "toggle static" }, dotSwatch("new"), "New place")),
    el("h3", {}, "In the files"),
    el("button", { class: "link", onclick: () => { zoomDlg.close(); showRow(h); } }, "See this row in stops.txt", icon("arrow")));
  document.getElementById("zoom-body").replaceChildren(view, side);
}

zoomDlg.addEventListener("close", () => { state.map = null; writeHash(); });
zoomDlg.addEventListener("click", e => { if (e.target === zoomDlg) zoomDlg.close(); });

/* ---------- Tabs, routing and render ---------- */
// [key, label, icon, count, description]
function tabInfo() {
  const S = D.shapes;
  const shapes = S ? sum(SHAPE_ORDER.filter(k => k !== "renamed").map(k => S.counts[k])) : null;
  return [
    ["overview", "Overview", "grid", null, highlightTotal ? "Notable highlights, changes by file" : "Changes by file"],
    ["files", "Files", "file", changedFiles.length || null, "Every changed row, old → new"],
    ["shapes", "Shapes", "route", shapes || null, S ? "Old and new lines on a map" : "Not compared in this run"],
  ];
}

function tabsBar() {
  swap(document.getElementById("tabs"), tabInfo().map(([k, label, ic, n, what]) =>
    el("button", { class: "tab" + (state.tab === k ? " on" : ""), "aria-current": state.tab === k ? "page" : null, title: what, onclick: () => setTab(k) },
      icon(ic), el("span", { class: "lb" }, label, n != null ? el("span", { class: "c" }, fmt(n)) : null), el("span", { class: "ds" }, what))));
}

function nextTabs() {
  return el("section", { class: "next" }, el("h3", {}, "Keep exploring"),
    el("div", { class: "next-grid" }, tabInfo().filter(([k]) => k !== state.tab).map(([k, label, ic, n, what]) =>
      el("button", { class: "next-btn", onclick: () => setTab(k) }, icon(ic),
        el("span", { class: "lb" }, n != null ? `${label} · ${fmt(n)}` : label), el("span", { class: "ds" }, what), go()))));
}

function setTab(t) {
  const changed = state.tab !== t;
  state.tab = t;
  render(changed);
  const top = document.querySelector(".tabs").offsetTop;
  if (scrollY > top) window.scrollTo({ top });
}

function writeHash() {
  const p = new URLSearchParams();
  p.set("tab", state.tab);
  if (state.tab === "files" && state.file) { p.set("file", state.file); if (state.part) p.set("rows", state.part); if (state.col) p.set("column", state.col); }
  if (state.tab === "shapes" && state.shape !== "all") p.set("kind", state.shape);
  if (state.map) p.set("shape", state.map);
  history.replaceState(null, "", "#" + p.toString());
}

function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (["overview", "files", "shapes"].includes(p.get("tab"))) state.tab = p.get("tab");
  if (p.get("file") && ALL_FILES.some(f => f.name === p.get("file"))) state.file = p.get("file");
  if (p.get("rows")) state.part = p.get("rows");
  if (p.get("column")) state.col = p.get("column");
  if (p.get("kind") && D.shapes && D.shapes.counts[p.get("kind")]) state.shape = p.get("kind");
  return p.get("shape");
}

function render(animate) {
  const active = document.activeElement, keep = active && active.id ? [active.id, active.selectionStart, active.selectionEnd] : null;
  tabsBar();
  const main = document.getElementById("main");
  swap(main, state.tab === "files" ? filesTab() : state.tab === "shapes" ? shapesTab() : overviewTab(), nextTabs());
  if (animate) { main.parentElement.classList.remove("enter"); void main.offsetWidth; main.parentElement.classList.add("enter"); }
  if (keep) {
    const n = document.getElementById(keep[0]);
    if (n) { n.focus({ preventScroll: true }); if (n.setSelectionRange && keep[1] != null) n.setSelectionRange(keep[1], keep[2]); }
  }
  const row = main.querySelector("tr.focus");
  if (row) row.scrollIntoView({ block: "center", behavior: "smooth" });
  state.focus = null;
  writeHash();
}

document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target || {}).tagName);
  if (zoomDlg.open) {
    if (typing) return;
    if (e.key === "ArrowLeft" && mapIndex > 0) { mapIndex--; state.whole = false; showMap(); }
    if (e.key === "ArrowRight" && mapIndex < mapList.length - 1) { mapIndex++; state.whole = false; showMap(); }
    return;
  }
  if (e.key === "/" && !typing && !e.metaKey && !e.ctrlKey) {
    const box = document.getElementById("rowq") || document.getElementById("shapeq");
    if (box) { e.preventDefault(); box.focus(); box.select(); }
  }
  if (e.key === "Escape" && typing && e.target.value) { e.target.value = ""; e.target.dispatchEvent(new Event("input")); }
});

header();
const tabsEl = document.querySelector(".tabs");
addEventListener("scroll", () => {
  const hero = document.getElementById("hero"), stick = scrollY > hero.offsetTop + hero.offsetHeight;
  if (stick === tabsEl.classList.contains("stuck")) return;
  // Offsets the height change so the page does not jump.
  const before = tabsEl.offsetHeight;
  tabsEl.classList.toggle("stuck", stick);
  tabsEl.style.marginBottom = stick ? `${before - tabsEl.offsetHeight}px` : "";
}, { passive: true });
const wantShape = readHash();
render(false);
if (wantShape && D.shapes) {
  const [b, n] = wantShape.split("|");
  const list = [...D.shapes.items].sort(byChange);
  const at = list.findIndex(i => (i.base || "") === b && (i.new || "") === n);
  if (at >= 0) openMap(list.map(item => ({ item })), at);
}
